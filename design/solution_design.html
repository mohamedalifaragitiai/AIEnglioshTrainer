  <!-- TITLE -->
  <text x="48" y="46" font-size="21" font-weight="800" fill="#0a3a66">AI English Coach · Solution Design — from a spoken sentence to a measured, improving learner profile</text>
  <text x="48" y="68" font-size="12.2" fill="#5b7186">Answer the learner <tspan font-weight="700" fill="#0a6bc2">in voice within 300&#8239;ms</tspan>, score the same turn <tspan font-weight="700" fill="#0a8293">off the critical path</tspan>, fold every score into <tspan font-weight="700" fill="#6a17a0">one durable profile</tspan>, and pitch the next question at the new level — all on ONE workstation, <tspan font-weight="700" fill="#c07d08">fully offline</tspan>, under a hard 96% resource ceiling.</text>
  <rect x="48" y="78" width="640" height="3" rx="2" fill="#0a6bc2"/>

  <!-- ================= BAND 1 : HOT PATH ================= -->
  <rect x="40" y="98" width="1520" height="272" rx="14" fill="#f6fbff" stroke="#7fb0dd"/>
  <text x="60" y="124" font-size="13" font-weight="800" fill="#0a3a66">&#9312; HOT PATH — the live voice turn: mic &#8594; VAD &#8594; STT &#8594; LLM &#8594; TTS &#8594; speaker, one guard-gated turn, streamed</text>
  <text x="60" y="142" font-size="9.4" fill="#0a6bc2"><tspan font-weight="700">Nothing on this path waits for scoring.</tspan> The turn ends the moment the coach starts speaking; evaluation happens afterwards, on the cold path, and may be deferred entirely.</text>

  <!-- learner -->
  <rect x="60" y="158" width="196" height="92" rx="12" fill="#eef7ff" stroke="#7fb0dd"/>
  <g filter="url(#tsh)"><rect x="74" y="170" width="32" height="32" rx="8" fill="url(#az)"/></g><use href="#g-mic" x="82" y="178" width="16" height="16" style="color:#fff"/>
  <text x="116" y="182" font-size="11" font-weight="700" fill="#0a3a66">Learner &#183; browser mic</text>
  <text x="116" y="197" font-size="8.7" fill="#5b7186">push-to-talk, no hot mic</text>
  <text x="74" y="218" font-size="8.7" fill="#5b7186">PCM16 mono @ 16&#8239;kHz, streamed</text>
  <text x="74" y="231" font-size="8.7" fill="#5b7186">over <tspan font-family="Consolas,monospace">WebSocket /ws/session</tspan></text>
  <text x="74" y="243" font-size="8.4" fill="#8aa0b3">level 0&#8211;5 + topic chosen up front</text>

  <g filter="url(#tsh)"><rect x="284" y="158" width="168" height="92" rx="12" fill="#ffffff" stroke="#7fb0dd"/></g>
  <use href="#g-wave" x="296" y="168" width="20" height="20" style="color:#0a6bc2"/>
  <text x="324" y="178" font-size="10.6" font-weight="700" fill="#0a3a66">1 &#183; VAD + segmenter</text>
  <text x="296" y="199" font-size="8.5" fill="#5b7186">energy VAD &#8212; offline,</text>
  <text x="296" y="212" font-size="8.5" fill="#5b7186">dependency-free default</text>
  <text x="296" y="225" font-size="8.5" fill="#5b7186">900&#8239;ms silence ends a turn</text>
  <text x="296" y="240" font-size="8.3" fill="#8aa0b3">Silero = optional upgrade</text>

  <!-- stt -->
  <g filter="url(#tsh)"><rect x="480" y="158" width="168" height="92" rx="12" fill="#ffffff" stroke="#7fb0dd"/></g>
  <use href="#g-scale" x="492" y="168" width="20" height="20" style="color:#0a6bc2"/>
  <text x="520" y="178" font-size="10.6" font-weight="700" fill="#0a3a66">2 &#183; STT</text>
  <text x="492" y="199" font-size="8.5" fill="#5b7186">Whisper <tspan font-family="Consolas,monospace">large-v3-turbo</tspan></text>
  <text x="492" y="212" font-size="8.5" fill="#5b7186">faster-whisper CT2, fp16</text>
  <text x="492" y="225" font-size="8.5" fill="#5b7186">resident on GPU ~1.9&#8239;GB</text>
  <text x="492" y="240" font-size="8.3" fill="#8aa0b3">&#8594; transcript + confidence</text>

  <!-- dialogue hero -->
  <g filter="url(#tsh)"><rect x="676" y="152" width="220" height="104" rx="14" fill="url(#azHero)"/></g>
  <use href="#g-chat" x="692" y="164" width="20" height="20" style="color:#bfe3ff"/>
  <text x="722" y="178" font-size="11.8" font-weight="800" fill="#ffffff">3 &#183; Dialogue &#8212; Qwen3-8B</text>
  <line x1="692" y1="188" x2="880" y2="188" stroke="#4f9bd6" stroke-width="1"/>
  <text x="692" y="204" font-size="8.9" fill="#dbeeff">AWQ, served by vLLM over an</text>
  <text x="692" y="217" font-size="8.9" fill="#dbeeff">OpenAI-compatible HTTP API</text>
  <text x="692" y="232" font-size="8.9" fill="#dbeeff"><tspan font-weight="800" fill="#ffe6a8">level + topic aware</tspan> system prompt</text>
  <text x="692" y="247" font-size="8.4" fill="#9fc9ee">streamed and drained sentence by sentence</text>

  <!-- tts -->
  <g filter="url(#tsh)"><rect x="924" y="158" width="168" height="92" rx="12" fill="#f2fbf6" stroke="#7cc79b"/></g>
  <use href="#g-speaker" x="936" y="168" width="20" height="20" style="color:#2e8f5c"/>
  <text x="964" y="178" font-size="10.6" font-weight="700" fill="#1c6b41">4 &#183; TTS &#8212; Kokoro-82M</text>
  <text x="936" y="199" font-size="8.5" fill="#3f6b52">resident on GPU ~0.3&#8239;GB</text>
  <text x="936" y="212" font-size="8.5" fill="#3f6b52">each finished sentence is</text>
  <text x="936" y="225" font-size="8.5" fill="#3f6b52">synthesised as it arrives</text>
  <text x="936" y="240" font-size="8.3" fill="#7d9a89">emoji stripped &#8212; never spoken</text>

  <!-- speaker back -->
  <rect x="1120" y="158" width="168" height="92" rx="12" fill="#eef7ff" stroke="#7fb0dd"/>
  <g filter="url(#tsh)"><rect x="1132" y="170" width="30" height="30" rx="8" fill="url(#azG)"/></g><use href="#g-user" x="1139" y="177" width="16" height="16" style="color:#fff"/>
  <text x="1170" y="182" font-size="10.6" font-weight="700" fill="#0a3a66">Coach speaks back</text>
  <text x="1132" y="207" font-size="8.5" fill="#5b7186">audio frames pushed down</text>
  <text x="1132" y="220" font-size="8.5" fill="#5b7186">the same socket, in order</text>
  <text x="1132" y="235" font-size="8.3" fill="#8aa0b3">voice-to-voice, nothing leaves</text>
  <text x="1132" y="246" font-size="8.3" fill="#8aa0b3">the machine</text>

  <!-- budget note -->
  <g filter="url(#tsh)"><rect x="1316" y="158" width="224" height="92" rx="12" fill="#fff9ec" stroke="#e0a92e" stroke-width="1.7"/></g>
  <use href="#g-clock" x="1328" y="168" width="20" height="20" style="color:#c9760f"/>
  <text x="1356" y="178" font-size="10.6" font-weight="700" fill="#8a5310">The 300&#8239;ms contract</text>
  <text x="1328" y="199" font-size="8.5" fill="#7a5a20">time-to-first-audio is a budget,</text>
  <text x="1328" y="212" font-size="8.5" fill="#7a5a20">not an aspiration &#8212; measured by</text>
  <text x="1328" y="225" font-size="8.5" fill="#7a5a20" font-family="Consolas,monospace">scripts/profile_hotpath.py</text>
  <text x="1328" y="241" font-size="8.3" fill="#a98b4e">and tracked as a p95 in Grafana</text>

  <!-- band1 row2 notes -->
  <rect x="60" y="268" width="730" height="84" rx="12" fill="#eef7ff" stroke="#bcd8ef"/>
  <use href="#g-sync" x="76" y="280" width="18" height="18" style="color:#0a6bc2"/>
  <text x="104" y="286" font-size="10.6" font-weight="800" fill="#0a3a66">The turn contract</text>
  <text x="78" y="308" font-size="9.2" fill="#33485c"><tspan font-weight="700" fill="#0a6bc2">In:</tspan> raw PCM16 frames. <tspan font-weight="700" fill="#0a6bc2">Out:</tspan> <tspan font-family="Consolas,monospace">transcript</tspan> &#183; <tspan font-family="Consolas,monospace">reply</tspan> tokens &#183; <tspan font-family="Consolas,monospace">audio</tspan> chunks &#183; <tspan font-family="Consolas,monospace">done</tspan>.</text>
  <text x="78" y="326" font-size="9.2" fill="#33485c">At turn end the pipeline publishes <tspan font-family="Consolas,monospace" font-weight="700" fill="#0a8293">UtteranceFinalized</tspan> on the in-process bus.</text>
  <text x="78" y="344" font-size="8.6" fill="#8aa0b3">That single event is the ONLY handoff to the cold path. Learner audio is optionally persisted for re-analysis.</text>

  <rect x="810" y="268" width="730" height="84" rx="12" fill="#f6effc" stroke="#c7abe4"/>
  <use href="#g-target" x="826" y="280" width="18" height="18" style="color:#6a17a0"/>
  <text x="854" y="286" font-size="10.6" font-weight="800" fill="#5f2ba0">Pitched at THIS learner</text>

  <text x="828" y="326" font-size="9.2" fill="#5a4a75">Topics come from <tspan font-family="Consolas,monospace">/topics</tspan>; the level comes from the learner's own stored profile.</text>
  <text x="828" y="344" font-size="8.6" fill="#8f80ab">Reasoning mode is disabled on the hot model &#8212; correctness of tone matters more than deliberation at 300&#8239;ms.</text>

  <!-- ================= BAND 2 : COLD PATH ================= -->
  <rect x="40" y="390" width="1520" height="282" rx="14" fill="#eefaf9" stroke="#4fbfb8"/>
  <text x="60" y="416" font-size="13" font-weight="800" fill="#086f7d">&#9313; COLD PATH — score the turn that just happened: evaluate &#8594; weigh &#8594; level &#8594; update the profile</text>
  <text x="60" y="434" font-size="9.4" fill="#0a8293"><tspan font-weight="700">Deferrable by design.</tspan> Under resource pressure the guard pauses this whole band first &#8212; the learner keeps talking, the scores simply arrive later.</text>

  <!-- event bus -->
  <g filter="url(#tsh)"><rect x="60" y="450" width="188" height="94" rx="12" fill="#ffffff" stroke="#4fbfb8"/></g>

  <text x="100" y="470" font-size="10.6" font-weight="700" fill="#0a3a66">Event bus</text>
  <text x="72" y="491" font-size="8.5" fill="#5b7186">asyncio, in-process</text>
  <text x="72" y="504" font-size="8.5" fill="#5b7186">no broker, no network</text>
  <text x="72" y="517" font-size="8.5" fill="#5b7186" font-family="Consolas,monospace">UtteranceFinalized</text>
  <text x="72" y="534" font-size="8.3" fill="#8aa0b3">one process = one moving part</text>

  <text x="316" y="470" font-size="10.6" font-weight="700" fill="#0a3a66">Cold-path worker</text>
  <text x="288" y="491" font-size="8.5" fill="#5b7186">queued, one turn at a time</text>
  <text x="288" y="504" font-size="8.5" fill="#5b7186"><tspan font-weight="700">idempotent</tspan> per utterance</text>
  <text x="288" y="517" font-size="8.5" fill="#5b7186">&#8594; one durable assessment</text>
  <text x="288" y="534" font-size="8.3" fill="#8aa0b3">re-delivery never double-scores</text>

  <text x="510" y="499" font-size="8.4" fill="#5b7186">cold Qwen3-14B &#183; <tspan font-weight="700">ONE JSON call</tspan></text>
  <text x="510" y="512" font-size="8.4" fill="#5b7186">grammar &#183; vocabulary &#183; listening</text>
  <text x="510" y="525" font-size="8.4" fill="#5b7186">coherence &#183; relevance</text>

  <text x="744" y="499" font-size="8.4" fill="#5b7186">deterministic &#8212; <tspan font-weight="700">no model at all</tspan></text>
  <text x="744" y="512" font-size="8.4" fill="#5b7186">speech rate &#183; pauses &#183; fillers</text>
  <text x="744" y="525" font-size="8.4" fill="#5b7186">hedging &#183; restarts</text>

  <text x="978" y="482" font-size="10" font-weight="700" fill="#0a3a66">Pronunciation &#8212; GOP</text>
  <text x="978" y="499" font-size="8.4" fill="#5b7186">wav2vec2 phoneme CTC, ~1.5&#8239;GB</text>
  <text x="978" y="512" font-size="8.4" fill="#5b7186">goodness-of-pronunciation per</text>
  <text x="978" y="525" font-size="8.4" fill="#5b7186">phoneme &#183; proxy fallback if off</text>

  <text x="1260" y="468" font-size="10.4" font-weight="800" fill="#8a5310">Why this path is separate</text>
  <text x="1234" y="490" font-size="8.7" fill="#7a5a20">A 14B evaluation costs seconds and VRAM. Putting</text>
  <text x="1234" y="503" font-size="8.7" fill="#7a5a20">it in the conversation would make the coach pause</text>
  <text x="1234" y="516" font-size="8.7" fill="#7a5a20">mid-dialogue &#8212; the one thing a speaking partner</text>
  <text x="1234" y="529" font-size="8.7" fill="#7a5a20">must never do. So it runs behind, and can wait.</text>

  <!-- ================= BAND 3 : PROFILE, INSIGHTS & THE LOOP ================= -->
  <rect x="40" y="692" width="1520" height="250" rx="14" fill="#f7f1fc" stroke="#b58fd8"/>
  <text x="60" y="718" font-size="13" font-weight="800" fill="#5f2ba0">&#9314; PROFILE, INSIGHTS &amp; THE LEARNING LOOP — what the stored history is actually FOR</text>

  <!-- store -->
  <g filter="url(#tsh)"><rect x="60" y="740" width="240" height="100" rx="12" fill="#ffffff" stroke="#b58fd8"/></g>
  <g filter="url(#tsh)"><rect x="74" y="752" width="32" height="32" rx="8" fill="url(#azT)"/></g><use href="#g-sql" x="82" y="760" width="16" height="16" style="color:#fff"/>
  <text x="116" y="764" font-size="10.8" font-weight="700" fill="#3a1660">SQLite (WAL) &#8212; one file</text>
  <text x="116" y="779" font-size="8.5" fill="#7a7193">forward-only migrations</text>
  <text x="74" y="800" font-size="8.6" fill="#5a4a75">users &#183; sessions &#183; utterances</text>
  <text x="74" y="813" font-size="8.6" fill="#5a4a75">assessments &#183; evaluator outputs</text>
  <text x="74" y="826" font-size="8.6" fill="#5a4a75">gap snapshots &#183; plans</text>
  <text x="74" y="837" font-size="8.2" fill="#9a8fb3">no server, no cloud, portable</text>

  <!-- gaps -->
  <g filter="url(#tsh)"><rect x="328" y="740" width="210" height="100" rx="12" fill="#ffffff" stroke="#b58fd8"/></g>
  <use href="#g-funnel" x="340" y="750" width="20" height="20" style="color:#6a17a0"/>
  <text x="368" y="760" font-size="10.6" font-weight="700" fill="#3a1660">Gap analysis</text>
  <text x="340" y="782" font-size="8.5" fill="#5a4a75">importance-weighted, ranked</text>
  <text x="340" y="795" font-size="8.5" fill="#5a4a75">distance from an 85 target</text>
  <text x="340" y="808" font-size="8.5" fill="#5a4a75">snapshots &#8594; movement over time</text>
  <text x="340" y="826" font-size="8.3" fill="#9a8fb3">also surfaces "most improved" &#8212;</text>
  <text x="340" y="837" font-size="8.3" fill="#9a8fb3">progress, not just deficits</text>

  <!-- plan -->
  <g filter="url(#tsh)"><rect x="566" y="740" width="210" height="100" rx="12" fill="#ffffff" stroke="#b58fd8"/></g>
  <use href="#g-book" x="578" y="750" width="20" height="20" style="color:#6a17a0"/>
  <text x="606" y="760" font-size="10.6" font-weight="700" fill="#3a1660">Adaptive study plan</text>
  <text x="578" y="782" font-size="8.5" fill="#5a4a75">difficulty set by the recent</text>
  <text x="578" y="795" font-size="8.5" fill="#5a4a75">trend &#8212; harder if climbing,</text>
  <text x="578" y="808" font-size="8.5" fill="#5a4a75">gentler if stalling</text>
  <text x="578" y="826" font-size="8.3" fill="#9a8fb3">targeted activities chosen per</text>
  <text x="578" y="837" font-size="8.3" fill="#9a8fb3">weak skill, not generic drills</text>

  <!-- feedback -->
  <g filter="url(#tsh)"><rect x="804" y="740" width="210" height="100" rx="12" fill="#ffffff" stroke="#b58fd8"/></g>
  <use href="#g-eye" x="816" y="750" width="20" height="20" style="color:#6a17a0"/>
  <text x="844" y="760" font-size="10.6" font-weight="700" fill="#3a1660">Post-session feedback</text>
  <text x="816" y="782" font-size="8.5" fill="#5a4a75">strengths &#183; weaknesses</text>
  <text x="816" y="795" font-size="8.5" fill="#5a4a75">concrete corrections, quoted</text>
  <text x="816" y="808" font-size="8.5" fill="#5a4a75">back from what was said</text>
  <text x="816" y="826" font-size="8.3" fill="#9a8fb3">delivered AFTER the conversation,</text>
  <text x="816" y="837" font-size="8.3" fill="#9a8fb3">never interrupting it</text>

  <!-- report hero -->
  <g filter="url(#tsh)"><rect x="1042" y="734" width="220" height="106" rx="13" fill="url(#azGold)"/></g>
  <use href="#g-star" x="1056" y="746" width="22" height="22" style="color:#fff5da"/>
  <text x="1086" y="760" font-size="11.4" font-weight="800" fill="#ffffff">Coach report</text>
  <text x="1058" y="782" font-size="8.7" fill="#fff3d4">one click &#8212; <tspan font-weight="800">JSON &#183; CSV &#183; Excel &#183; PDF</tspan></text>
  <text x="1058" y="796" font-size="8.7" fill="#fff3d4">scores, gaps, plan and the</text>
  <text x="1058" y="810" font-size="8.7" fill="#fff3d4">written verdict in one document</text>
  <text x="1058" y="828" font-size="8.5" fill="#ffe9bd">also rendered in-app, so the learner</text>
  <text x="1058" y="838" font-size="8.5" fill="#ffe9bd">never has to leave to see it</text>

  <text x="1304" y="782" font-size="8.6" fill="#5a4a75"><tspan font-family="Consolas,monospace">frontend/index.html</tspan> &#8212; zero-dep,</text>
  <text x="1304" y="794" font-size="8.6" fill="#5a4a75">no build, served by FastAPI on :8000</text>
  <text x="1304" y="811" font-size="8.6" fill="#5a4a75"><tspan font-family="Consolas,monospace">frontend-next/</tspan> &#8212; Next.js 14 +</text>
  <text x="1304" y="823" font-size="8.6" fill="#5a4a75">Tailwind + Recharts on :3000</text>
  <text x="1304" y="837" font-size="8.3" fill="#9a8fb3">tabs: Dashboard &#183; Practice &#183; Monitor &#183; Report</text>

  <!-- the loop -->
  <path d="M1152,842 C1152,876 780,884 420,880 260,878 180,872 180,842" fill="none" stroke="#6a17a0" stroke-width="1.9" stroke-dasharray="5 4" marker-end="url(#aP)"/>
  <text x="612" y="874" font-size="8.9" font-weight="700" fill="#6a17a0">every scored turn re-ranks the gaps and re-writes the plan</text>
  <text x="60" y="906" font-size="9.3" fill="#5a4a75"><tspan font-weight="700" fill="#5f2ba0">The loop closes back into Band &#9312;:</tspan> the profile's current level and the chosen topic become the coach's system prompt, so the very next question is pitched where the learner actually is &#8212; not where they started.</text>
  <text x="60" y="928" font-size="9.3" fill="#5a4a75"><tspan font-weight="700" fill="#5f2ba0">Longitudinal by construction:</tspan> assessments are append-only and stamped with the scoring version that produced them, so a trend line drawn across months stays honest even after the weights are retuned.</text>

  <text x="60" y="988" font-size="13" font-weight="800" fill="#0a3a66">&#9315; RUNTIME, MODELS &amp; THE 96% CEILING — one workstation, two processes, four resident models, one hard limit</text>

name: CI

# No Docker anywhere — uv for Python, npm for the dashboard.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (uv · ruff · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      - name: Soak the ResourceGuard under load
        run: uv run python scripts/soak_test.py --seconds 8

  frontend:
    name: Dashboard (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

[project]
name = "english-coach"
version = "0.2.0"
description = "Fully offline, self-hosted AI English Speaking & Listening Coach (resource-governed, no Docker)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "psutil>=6.1",
    "nvidia-ml-py>=12.560",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# Opt-in heavy ML runtime — NOT installed by default (keeps `uv sync` light and
# the app bootable without weights). Enable with: uv sync --group models
# torch/transformers/kokoro are host/CUDA-specific and installed per the README
# (WSL2 + CUDA index), not pinned here.
models = [
    "huggingface-hub>=0.26",
    "faster-whisper>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are meant to be call defaults (not B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "config"]
